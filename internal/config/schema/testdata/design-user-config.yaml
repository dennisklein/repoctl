# ~/.config/repoctl/config.yaml of dklein on hpc-a1
jobs: 3                        # parallel mock builds
sign:
  key: d.klein                 # an id from sign.keys of the set, or a full fingerprint
  backend: gpg                 # default; a YubiKey or a key file
agent:
  command: claude              # turns on the agent buttons of the web UI
  args: []
sets:
  slurm-25.11:
    jobs: 2                    # this set only

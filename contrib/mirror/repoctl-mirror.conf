# /etc/repoctl-mirror.conf: the config of the repoctl mirror job
# (https://dennisklein.github.io/repoctl/design/publish.html#mirror).
#
# One mirror line per set and target. The keyring is the key file of the
# release package that the clients of the set and target have; config
# management puts it there in the same rollout as these clients.
#
# set        target  package                                      served path                             keyring
slurm-26.05  el9     ghcr.io/gsi-hpc/slurm-repo/slurm-26.05-el9   /srv/repos/slurm-repo/slurm-26.05/el9   /etc/repoctl-mirror/keys/slurm-26.05-el9.asc
slurm-26.05  el10    ghcr.io/gsi-hpc/slurm-repo/slurm-26.05-el10  /srv/repos/slurm-repo/slurm-26.05/el10  /etc/repoctl-mirror/keys/slurm-26.05-el10.asc

# Old trees to keep per line besides the served one.
KEEP_TREES=2

# A command that gets "served SET TARGET" with the annotations of the new
# latest after each swap, and "failed" with the last 50 journal lines after
# a failed run (repoctl-mirror-failed.service). Default: none.
#NOTIFY=/usr/local/libexec/repoctl-mirror-notify

# The base directory of .objects/ and .trees/. It must be one file system
# (hard links), and the HTTP server must read it: each served path is a
# symlink into STATE_DIR/.trees/. Default: /var/lib/repoctl-mirror.
#STATE_DIR=/var/lib/repoctl-mirror

# The lock of a run. Default: /run/lock/repoctl-mirror.lock.
#LOCK=/run/lock/repoctl-mirror.lock

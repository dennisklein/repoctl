# The yank job of repoctl (docs/design/tool.html#tool-yank). It makes the
# RPM repo again without the versions of packaging/yanked.txt, signs the
# repodata, attaches the new rpm-repo.tar to the newest GitHub Release, marks
# the releases of the yanked versions, and starts docs.yml, which deploys
# the tree. Start it on main after the reviewed commit of yanked.txt; a
# maintainer approves it in the environment tool-release.
name: yank

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-release
  cancel-in-progress: false

jobs:
  yank:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: tool-release
    permissions:
      contents: write # the GitHub Releases
      actions: write # start docs.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg

      - name: Import the tool repository key
        env:
          TOOL_REPO_KEY: ${{ secrets.TOOL_REPO_KEY }}
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          fpr=$(packaging/import-key.sh)
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "SIGNER=$fpr" >>"$GITHUB_ENV"

      - name: Get the tree of the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "TAG=$tag" >>"$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern rpm-repo.tar --dir "$RUNNER_TEMP"
          mkdir old empty
          tar -xf "$RUNNER_TEMP/rpm-repo.tar" -C old

      - name: Make the tree without the yanked versions
        run: packaging/sign-tree.sh "$SIGNER" packaging/RPM-GPG-KEY-repoctl empty old out

      - name: Attach the tree and mark the yanked releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" out/rpm-repo.tar --clobber --repo "$GITHUB_REPOSITORY"
          sed 's/#.*//' packaging/yanked.txt | tr -d ' \t' | sed '/^$/d; s/^v//' | while read -r v; do
            title=$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json name --jq .name 2>/dev/null) || continue
            case $title in *"(yanked)"*) continue ;; esac
            notes=$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            printf '**Yanked**: this release is not in the RPM repo any more. Upgrade to a newer release.\n\n%s\n' "$notes" >notes.md
            gh release edit "v$v" --repo "$GITHUB_REPOSITORY" --title "$title (yanked)" --notes-file notes.md
          done

      - name: Deploy the docs with the new tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

# Builds, tests and lints repoctl, and checks the contract examples.
name: go

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tools/site/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tools/site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # rpmbuild, createrepo_c, rpmsign and gpg for the fake mock and the
      # end-to-end tests.
      - name: Install the RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg

      - name: Build
        run: make build

      - name: Check the generated contract types
        run: make check-generate

      - name: Check the contract examples
        run: make contract

      - name: Unit tests
        run: go test -race ./...

      - name: End-to-end tests
        run: make e2e

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The release binaries of golangci-lint v2.6.2 are built with Go 1.25
      # and refuse a Go 1.26 module; goinstall builds it with the Go of
      # setup-go.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          install-mode: goinstall

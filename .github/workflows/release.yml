# The release job of repoctl (docs/design/tool.html#pages). A tag v* on main
# builds the binary and the RPMs, signs them with the tool repository key,
# and puts the RPMs, the signed tree rpm-repo.tar and the attestations on a
# GitHub Release. The notes take the changes from CHANGELOG.md. Then it
# starts docs.yml on main, which deploys the docs with the tree of the
# newest release. A pre-release tag (v0.5.0-rc.1) makes
# a GitHub pre-release; the Pages repo does not take it.
#
# Only the job "sign" reads the key: it runs in the environment tool-release,
# which admits main and the tags v* and needs the approval of a maintainer.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: tool-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit of $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          if [ ! -s packaging/RPM-GPG-KEY-repoctl ]; then
            echo "::error::packaging/RPM-GPG-KEY-repoctl is missing: commit the public tool repository key first (packaging/README)"
            exit 1
          fi
          packaging/release-notes.sh check "$GITHUB_REF_NAME"
          v=${GITHUB_REF_NAME#v}
          if sed 's/#.*//' packaging/yanked.txt | tr -d ' \t' | sed 's/^v//' | grep -qxF "$v"; then
            echo "::error::$GITHUB_REF_NAME is in packaging/yanked.txt"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the binary and the RPMs
        run: packaging/build.sh "$GITHUB_REF_NAME" packaging/RPM-GPG-KEY-repoctl dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: tool-release
    permissions:
      contents: write # the GitHub Release
      id-token: write # the Sigstore certificate of the attestations
      attestations: write # the attestation store
      actions: write # start docs.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Import the tool repository key
        env:
          TOOL_REPO_KEY: ${{ secrets.TOOL_REPO_KEY }}
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          fpr=$(packaging/import-key.sh)
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "SIGNER=$fpr" >>"$GITHUB_ENV"

      - name: Get the tree of the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir old
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern rpm-repo.tar --dir "$RUNNER_TEMP"; then
            tar -xf "$RUNNER_TEMP/rpm-repo.tar" -C old
          else
            echo "No release has rpm-repo.tar yet: the tree starts empty."
          fi

      - name: Sign and make the tree
        run: packaging/sign-tree.sh "$SIGNER" packaging/RPM-GPG-KEY-repoctl dist old out

      - name: Collect the files of the release
        run: |
          mkdir release
          cp dist/repoctl-*-linux-x86_64.tar.gz out/rpm-repo.tar release/
          while read -r f; do cp "dist/$f" release/; done <out/added.txt
          (cd release && sha256sum -- * >SHA256SUMS)

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      # The changes come from CHANGELOG.md, the steps from the manual
      # (packaging/release-notes.sh).
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./packaging/rpmtree keys >"$RUNNER_TEMP/keys"
          packaging/release-notes.sh notes "$GITHUB_REF_NAME" out/tree/rpm/repoctl-release-*.noarch.rpm \
            "$RUNNER_TEMP/keys" "$SIGNER" >notes.md
          pre=()
          case $GITHUB_REF_NAME in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag "${pre[@]}" \
            --title "repoctl ${GITHUB_REF_NAME#v}" --notes-file notes.md release/*

      - name: Deploy the docs with the new tree
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
